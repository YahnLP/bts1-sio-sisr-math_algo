site_name: "Mathématiques pour l'informatique – BTS SIO 1re année"
site_description: "Cours, exercices, TP Python et aide-mémoire de mathématiques pour l'informatique (épreuve E3) du BTS SIO : numération, arithmétique, logique, ensembles, matrices, suites, graphes, algorithmique appliquée"
site_url: "https://yahnlp.github.io/bts1-sio-sisr-math_algo/"
site_author: "Yahn Le Prettre"
repo_url: "https://github.com/YahnLP/bts1-sio-sisr-math_algo"
edit_uri: "edit/main/docs/"

copyright: |
  © Yahn LE PRETTRE, Formateur ·
  <a rel="license" href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.fr">Licence CC BY-NC-SA 4.0</a>
  · Hébergé sur GitHub Pages

docs_dir: docs

theme:
  name: material
  language: fr
  font: false            # pas de police Google (RGPD)
  logo: images/logo-b1.png
  favicon: images/favicon.png
  custom_dir: my_theme_customizations/   # éditeur Python (Pyodide) et QCM
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: "Passer au mode nuit"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: "Passer au mode jour"
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
    - navigation.footer
    - content.tabs.link
    - content.tooltips

plugins:
  - search:
      lang: fr
  - awesome-pages
  - callouts
  - macros:
      render_by_default: false   # seules les pages avec « render_macros: true » passent par les macros (éditeur Python, QCM)

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - abbr
  - pymdownx.snippets:
      base_path: ['.']
      auto_append:
        - includes/abbr.md
      check_paths: false   # les fichiers *_REM.md de l’éditeur Python sont facultatifs
  - tables
  - toc:
      permalink: false
      toc_depth: 3
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - xtra/extra.css
  - xtra/stylesheets/qcm.css

extra_javascript:
  - xtra/javascripts/mathjax-config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
  - xtra/extra.js
